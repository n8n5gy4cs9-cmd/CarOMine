[package]
name = "caromine"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["Crowelian 2026 + Sonnet"]
license = "GPL-3.0-or-later"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
